<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- El tema se aplica antes del primer pintado para que no parpadee. Oliva es
         el de por defecto; solo "clay" (Arcilla) cambia algo. Ver index.css. -->
    <script>
      try {
        var t = localStorage.getItem('nv-theme')
        if (t === 'clay' || t === 'olive') document.documentElement.setAttribute('data-nv-theme', t)
      } catch (e) {}
    </script>
    <title>Estudio Nura · NuraVision</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
